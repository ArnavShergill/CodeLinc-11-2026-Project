name: Verify Docker submission

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - name: Build the submitted Dockerfile
        run: docker build --pull -t lifemap-submission -f Dockerfile .
      - name: Start the judge-facing website and API
        run: docker run -d --name lifemap-submission -p 5173:5173 lifemap-submission
      - name: Verify actual container endpoints
        run: python scripts/smoke_submission.py http://127.0.0.1:5173
      - name: Verify API survives a restart
        run: |
          docker restart lifemap-submission
          python scripts/smoke_submission.py http://127.0.0.1:5173
      - name: Container logs
        if: always()
        run: docker logs lifemap-submission
      - name: Stop verification container
        if: always()
        run: docker rm -f lifemap-submission
